name: Compilar APK

# Gastar Actions solo cuando hace falta un APK para instalarlo en el móvil:
# · main: al fusionar, si cambia algo que va dentro del APK (la app, la figura o Gradle), compila y lo publica en Releases.
#   Documentación (ROADMAP, CLAUDE.md, docs/*.md), servidor (supabase/) o este archivo: no compila nada.
# · Ramas de trabajo (claude/…): nunca solo. Cuando el usuario necesita el APK de una rama para probarlo:
#   Actions → Compilar APK → Run workflow → elegir la rama (queda como artefacto del run, 14 días).
#   Claude compila y prueba en local; no usa Actions para comprobar nada.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "docs/diseno/figura/figura.js"
      - "docs/diseno/figura/figura3d.js"
      - "docs/diseno/figura/three/**"
      - "docs/diseno/figura/modelos/*.glb"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
  workflow_dispatch:

# Si se lanza otra vez en la misma rama, solo cuenta la última
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compilar y probar
        run: gradle assembleRelease testReleaseUnitTest --no-daemon --stacktrace

      - name: Preparar APK
        run: cp app/build/outputs/apk/release/app-release.apk rutina-core.apk

      # C1: la figura 3D va dentro del APK (copiada de docs/diseno/figura al compilar). Si falta algo, el run falla.
      - name: Comprobar que el APK lleva la figura y la letra
        run: |
          unzip -l rutina-core.apk > contenido.txt
          for f in assets/index.html assets/rutina.json assets/app/app.js assets/app/fig.js assets/app/fuente/atkinson-hyperlegible-next.woff2 \
                   assets/figura/figura.js assets/figura/figura3d.js assets/figura/three/build/three.module.min.js \
                   assets/figura/three/examples/jsm/loaders/GLTFLoader.js assets/figura/modelos/persona_m.glb assets/figura/modelos/persona_f.glb; do
            grep -q " $f$" contenido.txt || { echo "Falta $f en el APK"; exit 1; }
          done
          grep "assets/figura/modelos" contenido.txt
          ls -l rutina-core.apk

      - name: Guardar el APK de la rama
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: rutina-core-1.0.${{ github.run_number }}
          path: rutina-core.apk
          retention-days: 14

      - name: Publicar versión
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Rutina core 1.0.${{ github.run_number }}
          body: Descarga **rutina-core.apk** desde el móvil e instálalo encima de la versión anterior.
          files: rutina-core.apk
          make_latest: true

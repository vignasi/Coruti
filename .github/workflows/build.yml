name: Compilar APK

# En main: compila y publica el APK en Releases (con el repo privado, solo lo descarga quien tenga acceso).
# En las ramas de trabajo (claude/…): compila, pasa las pruebas y deja el APK como artefacto del run para probarlo antes de fusionar.
on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compilar y probar
        run: gradle assembleRelease testReleaseUnitTest --no-daemon --stacktrace

      - name: Preparar APK
        run: cp app/build/outputs/apk/release/app-release.apk rutina-core.apk

      - name: Guardar el APK de la rama
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: rutina-core-1.0.${{ github.run_number }}
          path: rutina-core.apk
          retention-days: 14

      - name: Publicar versión
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Rutina core 1.0.${{ github.run_number }}
          body: Descarga **rutina-core.apk** desde el móvil e instálalo encima de la versión anterior.
          files: rutina-core.apk
          make_latest: true

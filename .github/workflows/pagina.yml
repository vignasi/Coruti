name: Página del conector de Claude

# Publica web/ en GitHub Pages (https://vignasi.github.io/Coruti/claude/): la página donde entras con tu cuenta
# de la app al conectar Claude (B2a, docs/claude.md). Solo corre si cambia web/ en main, o a mano.
# Una vez: Settings → Pages → Source: «GitHub Actions».
on:
  push:
    branches: [main]
    paths: ["web/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pub.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: pub
        uses: actions/deploy-pages@v4

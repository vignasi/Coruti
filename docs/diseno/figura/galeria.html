<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Figura · todos los ejercicios</title>
<style>
:root{--bg:#EDF1F0;--surface:#FFFFFF;--ink:#17201E;--soft:#55625F;--line:#CFD9D6;--accent:#1E6B74}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0F1513;--surface:#171F1D;--ink:#E4EBE8;--soft:#9AA9A5;--line:#2B3633;--accent:#62B8C1}}
:root[data-theme="dark"]{--bg:#0F1513;--surface:#171F1D;--ink:#E4EBE8;--soft:#9AA9A5;--line:#2B3633;--accent:#62B8C1}
*{box-sizing:border-box}
body{margin:0;padding:12px;background:var(--bg);color:var(--ink);font:14px/1.35 system-ui,"Roboto",sans-serif}
.ex{background:var(--surface);border-radius:14px;padding:8px;margin-bottom:10px}
.ex h2{font-size:14px;margin:0 0 4px}.ex h2 small{color:var(--soft);font-weight:400}
.row{display:grid;gap:6px}
canvas{width:100%;aspect-ratio:180/112;display:block}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.minis .ex{padding:5px}.minis .ex h2{font-size:12px;font-weight:500;margin:4px 0 0}
</style>
</head>
<body>
<div id="out"></div>
<script src="figura.js"></script>
<script>
/* Para revisar con capturas: ?s=palos|redondo|persona &g=m|f &size=big|mini &theme=dark &ex=a,b */
const q=new URLSearchParams(location.search);
if(q.get("theme"))document.documentElement.dataset.theme=q.get("theme");
fetch(q.get("data")||"../../../app/src/main/assets/rutina.json").then(r=>r.json()).then(D=>{
  const keys=(q.get("ex")||Object.keys(D.exercises).join(",")).split(",").filter(k=>D.exercises[k]);
  const dark=document.documentElement.dataset.theme==="dark"||(!document.documentElement.dataset.theme&&matchMedia("(prefers-color-scheme: dark)").matches);
  const o={style:q.get("s")||"persona",gender:q.get("g")||"m",text:D.marks,dark,bg:getComputedStyle(document.documentElement).getPropertyValue("--surface").trim()},out=document.getElementById("out"),big=q.get("size")!=="mini";
  if(!big)out.className="minis";
  const jobs=[];
  keys.forEach(k=>{const ex=D.exercises[k],box=document.createElement("div");box.className="ex";
    const h=document.createElement("h2");h.innerHTML=ex.name+(big?" <small>"+k+"</small>":"");
    if(big){box.append(h);const row=document.createElement("div");row.className="row";box.append(row);
      ex.phases.forEach((ph,i)=>{const c=document.createElement("canvas");row.append(c);jobs.push(()=>Figura.draw(c,ex,Figura.phaseT(ex,i),true,{...o,key:k,labels:true,pt:.26}));});}
    else{const c=document.createElement("canvas");box.append(c,h);jobs.push(()=>Figura.draw(c,ex,Figura.keyT(ex),true,{...o,key:k}));}
    out.append(box);});
  requestAnimationFrame(()=>{jobs.forEach(f=>f());window.__done=true;});
});
</script>
</body>
</html>

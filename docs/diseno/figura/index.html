<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Figura humana · prueba de estilo</title>
<style>
:root{--bg:#EDF1F0;--surface:#FFFFFF;--ink:#17201E;--soft:#55625F;--line:#CFD9D6;--accent:#1E6B74;--hl:#D98E1F}
@media (prefers-color-scheme: dark){:root{--bg:#0F1513;--surface:#171F1D;--ink:#E4EBE8;--soft:#9AA9A5;--line:#2B3633;--accent:#62B8C1;--hl:#F0B04A}}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,"Roboto",sans-serif}
h1{font-size:22px;margin:0 0 4px}
p{margin:0 0 16px;color:var(--soft)}
.big{background:var(--surface);border-radius:20px;padding:12px;margin-bottom:16px}
.big canvas{width:100%;aspect-ratio:180/112;display:block}
.big b{display:block;font-size:17px;margin-top:6px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;margin-bottom:12px}
.seg button{border:0;background:transparent;color:var(--ink);font:600 15px system-ui;padding:10px 18px;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--surface);border-radius:14px;padding:6px 6px 8px}
.tile canvas{width:100%;aspect-ratio:180/112;display:block}
.tile span{display:block;font-size:13px;line-height:1.25;margin-top:4px}
</style>
</head>
<body>
<h1>Figura humana · prueba de estilo</h1>
<p>Arriba, el movimiento entero con lo que trabaja señalado. Abajo, las miniaturas del catálogo, sin marcas: tócalas para verlas en grande.</p>
<div class="seg" role="group" aria-label="Figura"><button id="gm" aria-pressed="true">Hombre</button><button id="gf" aria-pressed="false">Mujer</button></div>
<div class="big"><canvas id="big"></canvas><b id="bigname"></b></div>
<div class="grid" id="grid"></div>
<script src="figura.js"></script>
<script>
fetch(new URLSearchParams(location.search).get("data")||"../../../app/src/main/assets/rutina.json").then(r=>r.json()).then(D=>{
  const keys=(new URLSearchParams(location.search).get("ex")||"curl_goma,puente,deadbug,plancha,remo_goma,psoas,almeja,press_goma,plancha_lat").split(",").filter(k=>D.exercises[k]);
  const big=document.getElementById("big"); let cur=keys[0];
  document.getElementById("bigname").textContent=D.exercises[cur].name;
  const tiles=keys.map(k=>{const t=document.createElement("div");t.className="tile";const c=document.createElement("canvas");const s=document.createElement("span");s.textContent=D.exercises[k].name;t.append(c,s);
    t.onclick=()=>{cur=k;document.getElementById("bigname").textContent=D.exercises[k].name;};document.getElementById("grid").appendChild(t);return [k,c];});
  const t0=performance.now();
  const q=new URLSearchParams(location.search),still=q.has("still");let gender=q.get("g")==="f"?"f":"m";
  const setG=v=>{gender=v;document.getElementById("gm").setAttribute("aria-pressed",v==="m");document.getElementById("gf").setAttribute("aria-pressed",v==="f");};
  setG(gender);document.getElementById("gm").onclick=()=>setG("m");document.getElementById("gf").onclick=()=>setG("f");
  if(q.get("big"))cur=q.get("big"),document.getElementById("bigname").textContent=D.exercises[cur].name;
  function loop(now){const t=still?Figura.keyT(D.exercises[cur]):(now-t0)/1000;
    Figura.draw(big,D.exercises[cur],t,!!D.exercises[cur].hold,{gender,labels:true,text:D.marks});
    tiles.forEach(([k,c])=>Figura.draw(c,D.exercises[k],Figura.keyT(D.exercises[k]),true,{gender}));
    if(!still)requestAnimationFrame(loop); else window.__done=true;}
  requestAnimationFrame(loop);
});
</script>
</body>
</html>

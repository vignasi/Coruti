<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&display=swap">
<link rel="stylesheet" href="estilos.css">
<script>
/* La figura 3D (D1) está en ../figura/ dentro del repo; en la página publicada, en figura/ junto a esta.
   Se mira cuál existe antes de cargar nada, porque el importmap de three.js tiene que ir antes de cualquier módulo. */
(function () {
  var base = 'figura/';
  try { var x = new XMLHttpRequest(); x.open('HEAD', '../figura/figura3d.js', false); x.send(); if (x.status === 200) base = '../figura/'; } catch (e) {}
  window.FIG_BASE = base;
  var T = new URL(base + 'three/', location.href).href, im = document.createElement('script');
  im.type = 'importmap'; im.textContent = JSON.stringify({ imports: { three: T + 'build/three.module.min.js', 'three/addons/': T + 'examples/jsm/' } });
  document.currentScript.after(im);
  window.FIG_LISTA = new Promise(function (ok) { var s = document.createElement('script'); s.src = base + 'figura.js'; s.onload = ok; s.onerror = ok; document.head.appendChild(s); });
})();
</script>
<div class="proto">
  <div class="proto-barra" role="toolbar" aria-label="Prototipo">
    <strong>Prototipo · D2</strong>
    <button data-go="mapa">Pantallas</button>
    <button data-tema="ciclo" id="tema">Tema: auto</button>
  </div>
  <div class="escenario"><main class="movil" id="movil" aria-live="off"></main></div>
</div>
<script src="datos.js"></script>
<script src="app.js"></script>
<script type="module" src="figura-proto.js"></script>

# Strava y Polar vuelven a «conexiones» sin JWT, y Polar avisa a «polar-aviso» sin JWT:
# cada función comprueba por su cuenta quién llama (cuenta de la app, firma de Polar o clave de la tarea programada).
[functions.conexiones]
verify_jwt = false

[functions.polar-aviso]
verify_jwt = false

# El conector de Claude (B2a, docs/claude.md): contesta 401 con la dirección del inicio de sesión OAuth,
# y comprueba el token por su cuenta con Supabase Auth.
[functions.claude]
verify_jwt = false
